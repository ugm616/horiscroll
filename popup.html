<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ox Alpha Scroll</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body class="header">
    <div class="logo" aria-hidden="true">Ox</div>
    <div>
      <h1>Ox Alpha Scroll</h1>
      <p class="subtitle">Horizontal scroll anywhere</p>
    </div>
  </header>

  <main>
    <!-- Master toggle -->
    <section class="card">
      <label class="toggle-row" for="globalToggle">
        <div>
          <span class="label">Enable extension</span>
          <span class="hint">Master on/off for all sites</span>
        </div>
        <span class="switch">
          <input id="globalToggle" />
          <span class="slider"></span>
        </span>
      </label>
    </section>

    <!-- Current site -->
    <section class="card">
      <div class="site-row">
        <div class="site-info">
          <span class="label">This site</span>
          <span class="hint" id="siteHost">…</span>
        </div>
        <span class="switch">
          <input type="checkbox" id="siteToggle" />
          <span class="slider"></span>
        </span>
      </div>
      <p class="note" id="siteNote"></p>
    </section>

    <!-- Behavior -->
    <section      <label class="toggle-row" for="shiftWheelToggle">
        <div>
          <span class="label">Shift + wheel scrolls sideways</span>
          <span class="hint">Hold Shift while scrolling</span>
        </div>
        <span class="switch">
          <input type="checkbox" id="shiftWheelToggle" checked />
          <span class="slider"></span>
        </span>
      </label>

      <label class="toggle-row" for="barToggle">
        <div>
          <span class="label">Floating scrollbar</span>
          <span class="hint">Show overlay scrollbar on supported pages</span>
        </div>
        <span class="switch">
          <input type="checkbox" id="barToggle" checked />
          <span class="slider"></span>
        </span>
      </label>
    </section>

    <!-- Actions -->
    <section class="actions">
      <button id="highlightBtn" class="btn secondary">
        <span class="btn-icon">🔍</span> Detect areas
      </button>
      <button id="optionsBtn" class="btn secondary">
        <span class="btn-icon">⚙️</span> Manage sites
      </button>
    </section>

    <p class="status" id="status" role="status" aria-live="polite"></p>
  </main>

  <footer>
    <a href="#" id="helpLink">Keyboard &amp; tips</a>
  </footer>

  <script src="popup.js"></script>
</body>
</html>
